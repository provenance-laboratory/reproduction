name: Reproduction report
description: You ran train.py. Tell us what you got — including if it failed.
title: "reproduction report: <your CPU>"
labels: ["reproduction-report"]
body:
  - type: markdown
    attributes:
      value: |
        **A failed or partial report is worth filing.** The measurement is what happens when
        people try, not what happens when it works.

        We do not assist: if you got stuck, please file this rather than asking us how to get
        past it. Any help we give has to be logged and reported separately in the paper, which
        makes your report less useful, not more.

        Most of what is asked below is already in the `run.json` your run wrote. **Attaching that
        file is enough — you can skip the rest.**
  - type: textarea
    id: runjson
    attributes:
      label: run.json
      description: Paste or attach it. This alone answers most of the fields below.
      render: json
  - type: input
    id: digest
    attributes:
      label: The weights_sha256 you obtained
      placeholder: e.g. ccf303f04e8ab1f02723f199137f9eb237bd042bd754bb87e09a0333a19e18cd
  - type: dropdown
    id: matched
    attributes:
      label: Did it match the published digest?
      options:
        - "Yes — bit-identical"
        - "No — different digest"
        - "The run did not complete"
        - "I could not get as far as running it"
  - type: input
    id: cpu
    attributes:
      label: CPU model
      description: Exactly as your OS reports it, please — not a summary.
      placeholder: e.g. AMD Ryzen 9 5900HX with Radeon Graphics
  - type: input
    id: threads
    attributes:
      label: Thread environment
      description: What OMP_NUM_THREADS / OPENBLAS_NUM_THREADS were actually set to when it ran.
      placeholder: e.g. OPENBLAS_NUM_THREADS=1 (set by train.py)
  - type: input
    id: versions
    attributes:
      label: python / numpy / BLAS versions
      placeholder: e.g. 3.12.4 / 2.1.0 / OpenBLAS 0.3.27
  - type: dropdown
    id: sums
    attributes:
      label: Did `sha256sum -c SHA256SUMS` pass?
      options:
        - "Yes"
        - "No"
        - "I did not check"
  - type: textarea
    id: went_wrong
    attributes:
      label: What went wrong, or anything else worth knowing
      description: |
        Unclear instructions, a missing dependency, a platform we did not anticipate, an error
        message, a step that took far longer than stated — all of it is data about what
        reproducibility actually costs. This is the most useful box on the form.
  - type: checkboxes
    id: assistance
    attributes:
      label: Assistance
      options:
        - label: >-
            Nobody associated with this project helped me get this running. (If we did help,
            please tick nothing — we will log it, and your run is reported separately rather
            than discarded.)
          required: false
  - type: markdown
    attributes:
      value: |
        ---
        **We will not describe you as independent, affiliated, or anything else.** The paper
        reports what was filed and where, so a reader can open this thread and judge for
        themselves. That is deliberate: characterising your independence on your behalf would be
        us asserting the very thing a reader should be checking.
